<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Koh Samui</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
      html,body{margin:0;padding:0;height:100%}
      .staticrypt-body{
        background:#0B1418;color:#EAF1F3;min-height:100dvh;
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,sans-serif;
        display:flex;align-items:center;justify-content:center;
        padding:24px 18px calc(24px + env(safe-area-inset-bottom));
        -webkit-text-size-adjust:100%;
      }
      .hidden{display:none!important}
      .staticrypt-spinner-container{min-height:100dvh;display:flex;align-items:center;justify-content:center}
      .staticrypt-spinner{
        width:34px;height:34px;border-radius:50%;
        border:3px solid #1E353D;border-top-color:#F2A65A;
        animation:sp .8s linear infinite;
      }
      @keyframes sp{to{transform:rotate(360deg)}}
      .staticrypt-content{width:100%}
      .staticrypt-page{width:100%;display:flex;justify-content:center}
      .staticrypt-form{
        width:100%;max-width:380px;
        background:#122127;border:1px solid #1E353D;border-radius:18px;
        padding:30px 22px 24px;text-align:center;
      }
      .staticrypt-instructions{margin-bottom:4px}
      .staticrypt-title{
        font-size:26px;font-weight:800;letter-spacing:-.8px;margin:0 0 8px;line-height:1.15;
      }
      .staticrypt-instructions p:last-child{
        margin:0;color:#93A9B1;font-size:14.5px;line-height:1.6;
      }
      .staticrypt-hr{border:none;border-top:1px solid #1E353D;margin:20px 0}
      .staticrypt-password-container{position:relative;display:block}
      #staticrypt-password{
        width:100%;min-height:52px;
        background:#0E1B20;border:1px solid #2A4A54;border-radius:11px;
        color:#EAF1F3;font-size:16px;font-family:inherit;
        padding:14px 46px 14px 15px;outline:none;
      }
      #staticrypt-password::placeholder{color:#63797F}
      #staticrypt-password:focus{border-color:#F2A65A}
      .staticrypt-toggle-password-visibility{
        position:absolute;right:14px;top:50%;transform:translateY(-50%);
        width:20px;height:20px;cursor:pointer;opacity:.5;filter:invert(1);
      }
      .staticrypt-remember{
        display:flex;align-items:center;justify-content:center;gap:8px;
        margin-top:14px;color:#93A9B1;font-size:13.5px;cursor:pointer;min-height:44px;
      }
      #staticrypt-remember{width:17px;height:17px;accent-color:#F2A65A}
      .staticrypt-decrypt-button{
        width:100%;min-height:52px;margin-top:16px;
        background:#F2A65A;color:#0B1418;border:none;border-radius:11px;
        font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;
        letter-spacing:.2px;touch-action:manipulation;
        transition:transform .15s ease,opacity .2s ease;
      }
      .staticrypt-decrypt-button:active{transform:scale(.985);opacity:.9}
      #staticrypt-decrypt-button-error{
        color:#F0705F;font-size:13.5px;margin-top:12px;min-height:18px;
      }
      @media(max-width:360px){
        .staticrypt-form{padding:26px 18px 22px}
        .staticrypt-title{font-size:23px}
      }
    </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container">
            <div class="staticrypt-spinner"></div>
        </div>
